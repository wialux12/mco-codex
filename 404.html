<style>
  /* страница 404: шапка сверху, карточка по центру оставшейся высоты */
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .nf { flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 8px; padding-bottom: 48px; }
  .nf__card {
    width: 100%; max-width: 880px;
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: center; gap: 28px;
    padding: 40px 40px 40px 44px; overflow: hidden;
    background: linear-gradient(160deg, var(--card-blue-2), var(--card-bg) 70%);
  }
  .nf__text { display: flex; flex-direction: column; align-items: flex-start; }
  .nf__title { font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; margin: 14px 0 14px; }
  .nf__lead { font-size: 15.5px; line-height: 1.6; max-width: 380px; margin-bottom: 26px; }
  .nf__actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .nf__actions .btn { min-height: 48px; padding: 10px 24px; font-size: 14.5px; }
  .nf__visual { display: flex; justify-content: center; }
  .nf__sticker { width: 100%; max-width: 360px; transform: rotate(-3deg); }

  @media (max-width: 820px) {
    .nf__card { padding: 32px 30px; gap: 20px; }
  }
  @media (max-width: 640px) {
    .nf { align-items: flex-start; padding-top: 4px; padding-bottom: 28px; }
    .nf__card { grid-template-columns: 1fr; gap: 6px; }
    .nf__visual { order: -1; }
    .nf__sticker { max-width: 300px; }
    .nf__lead { max-width: none; }
    .nf__actions { width: 100%; }
    .nf__actions .btn { flex: 1 1 100%; justify-content: center; }
  }
  @media (max-width: 560px) {
    .nf__card { padding: 22px 18px 24px; }
  }
</style>
